<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>NovaStore Arkitekturdiagram</title>

  <!-- Background -->
  <rect width="720" height="480" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f0f0">NovaStore – Systemarkitektur</text>

  <!-- DOCKER COMPOSE wrapper -->
  <rect x="30" y="58" width="660" height="380" rx="10" fill="none" stroke="#3a3a4a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="78" font-size="11" fill="#888" font-weight="600">docker-compose</text>

  <!-- PYTHON APP -->
  <rect x="270" y="88" width="180" height="64" rx="8" fill="#1e2a3a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="360" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#4a90d9">Python App</text>
  <text x="360" y="132" text-anchor="middle" font-size="10" fill="#999">psycopg2 · pymongo · redis-py</text>

  <!-- POSTGRESQL -->
  <rect x="60" y="230" width="160" height="72" rx="8" fill="#1a2e1a" stroke="#4caf50" stroke-width="1.5"/>
  <text x="140" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#4caf50">PostgreSQL 16</text>
  <text x="140" y="274" text-anchor="middle" font-size="10" fill="#999">port 5432</text>
  <text x="140" y="291" text-anchor="middle" font-size="10" fill="#999">customers · products · orders</text>

  <!-- MONGODB -->
  <rect x="280" y="230" width="160" height="72" rx="8" fill="#2a1e1a" stroke="#e67e22" stroke-width="1.5"/>
  <text x="360" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#e67e22">MongoDB 7</text>
  <text x="360" y="274" text-anchor="middle" font-size="10" fill="#999">port 27017</text>
  <text x="360" y="291" text-anchor="middle" font-size="10" fill="#999">orders (dokument)</text>

  <!-- REDIS -->
  <rect x="500" y="230" width="160" height="72" rx="8" fill="#2a1a1a" stroke="#e53935" stroke-width="1.5"/>
  <text x="580" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#e53935">Redis 7</text>
  <text x="580" y="274" text-anchor="middle" font-size="10" fill="#999">port 6379</text>
  <text x="580" y="291" text-anchor="middle" font-size="10" fill="#999">cache · session</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4caf50"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e53935"/>
    </marker>
  </defs>

  <line x1="310" y1="152" x2="175" y2="230" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="215" y="196" text-anchor="middle" font-size="9" fill="#4caf50" transform="rotate(-35 215 196)">SQL / CRUD</text>

  <line x1="360" y1="152" x2="360" y2="230" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="380" y="198" font-size="9" fill="#e67e22">documents</text>

  <line x1="410" y1="152" x2="545" y2="230" stroke="#e53935" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="500" y="196" text-anchor="middle" font-size="9" fill="#e53935" transform="rotate(35 500 196)">cache GET/SET</text>

  <!-- Volumes -->
  <text x="360" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#777">Docker Volumes (persistent data)</text>
  <rect x="70" y="355" width="130" height="32" rx="5" fill="#1a1a2a" stroke="#3a3a4a" stroke-width="1"/>
  <text x="135" y="375" text-anchor="middle" font-size="10" fill="#aaa">postgres_data</text>
  <rect x="290" y="355" width="130" height="32" rx="5" fill="#1a1a2a" stroke="#3a3a4a" stroke-width="1"/>
  <text x="355" y="375" text-anchor="middle" font-size="10" fill="#aaa">mongo_data</text>
  <rect x="510" y="355" width="130" height="32" rx="5" fill="#1a1a2a" stroke="#3a3a4a" stroke-width="1"/>
  <text x="575" y="375" text-anchor="middle" font-size="10" fill="#aaa">redis_data</text>

  <line x1="140" y1="302" x2="135" y2="355" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360" y1="302" x2="355" y2="355" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="580" y1="302" x2="575" y2="355" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Legend -->
  <rect x="60" y="405" width="600" height="26" rx="5" fill="#1a1a2a"/>
  <rect x="75" y="413" width="10" height="10" rx="2" fill="#4caf50"/>
  <text x="92" y="422" font-size="10" fill="#aaa">SQL – relationer, transaktioner</text>
  <rect x="250" y="413" width="10" height="10" rx="2" fill="#e67e22"/>
  <text x="267" y="422" font-size="10" fill="#aaa">NoSQL – flexibla dokument</text>
  <rect x="420" y="413" width="10" height="10" rx="2" fill="#e53935"/>
  <text x="437" y="422" font-size="10" fill="#aaa">Cache – snabb läsning, TTL</text>
</svg>
